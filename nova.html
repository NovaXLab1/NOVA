<script>

/* ============================
   SISTEMA
============================ */

let recognition = null;

let sistemaActivo = false;

let hablando = false;

let esperandoComando = false;

let escuchando = false;

let reinicio = null;

let voces = [];


/* ============================
   ELEMENTOS
============================ */

const status =
    document.getElementById("status");

const orbe =
    document.getElementById("orbe");

const mensajes =
    document.getElementById("mensajes");

const entrada =
    document.getElementById("entrada");


/* ============================
   VOCES
============================ */

function cargarVoces() {

    voces =
        speechSynthesis.getVoices();

}

speechSynthesis.onvoiceschanged =
    cargarVoces;

cargarVoces();


/* ============================
   HISTORIAL
============================ */

function agregarMensaje(tipo, texto) {

    const contenedor =
        document.createElement("div");

    contenedor.className =
        "mensaje " + tipo;

    const etiqueta =
        document.createElement("div");

    etiqueta.className =
        "etiqueta";

    etiqueta.innerText =
        tipo === "usuario"
        ? "TÚ"
        : "NOVA";

    const burbuja =
        document.createElement("div");

    burbuja.className =
        "burbuja";

    burbuja.innerText =
        texto;

    contenedor.appendChild(
        etiqueta
    );

    contenedor.appendChild(
        burbuja
    );

    mensajes.appendChild(
        contenedor
    );

    mensajes.scrollTop =
        mensajes.scrollHeight;
}


/* ============================
   LIMPIAR
============================ */

function limpiarHistorial() {

    mensajes.innerHTML = "";

}


/* ============================
   HABLAR
============================ */

function hablar(texto) {

    if (!texto)
        return;

    hablando = true;

    detenerReconocimiento();

    speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(
            texto
        );

    voz.lang =
        "es-MX";

    voz.rate =
        .95;

    voz.pitch =
        .9;

    const vozEsp =
        voces.find(
            v =>
                v.lang &&
                v.lang
                    .toLowerCase()
                    .startsWith("es")
        );

    if (vozEsp)
        voz.voice = vozEsp;

    orbe.classList.add(
        "hablando"
    );

    status.innerText =
        "NOVA HABLANDO";

    voz.onend =
        terminarHabla;

    voz.onerror =
        terminarHabla;

    speechSynthesis.speak(
        voz
    );
}


function terminarHabla() {

    hablando = false;

    orbe.classList.remove(
        "hablando"
    );

    if (sistemaActivo) {

        status.innerText =
            "ESPERANDO NOVA";

        esperarEscucha();

    }

}


/* ============================
   RESPONDER
============================ */

function responder(texto) {

    agregarMensaje(
        "nova",
        texto
    );

    hablar(
        texto
    );

}


/* ============================
   RECONOCIMIENTO
============================ */

function detenerReconocimiento() {

    if (!recognition)
        return;

    try {
        recognition.stop();
    }
    catch(e) {}

    escuchando = false;

    orbe.classList.remove(
        "escuchando"
    );

}


function prepararRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        responder(
            "Tu navegador no tiene reconocimiento de voz."
        );

        return false;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "es-MX";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        5;


    recognition.onstart =
        function() {

            if (
                !sistemaActivo ||
                hablando
            )
                return;

            escuchando = true;

            status.innerText =
                "ESCUCHANDO";

            orbe.classList.add(
                "escuchando"
            );

        };


    recognition.onresult =
        function(event) {

            if (
                !sistemaActivo ||
                hablando
            )
                return;

            const texto =
                event
                    .results[0][0]
                    .transcript
                    .toLowerCase()
                    .trim();

            escuchando = false;

            orbe.classList.remove(
                "escuchando"
            );


            if (
                !esperandoComando
            ) {

                if (
                    detectarNOVA(
                        texto
                    )
                ) {

                    esperandoComando =
                        true;

                    responder(
                        "Te escucho."
                    );

                }

                return;

            }


            esperandoComando =
                false;

            agregarMensaje(
                "usuario",
                texto
            );

            procesar(
                texto
            );

        };


    recognition.onerror =
        function(event) {

            escuchando = false;

            orbe.classList.remove(
                "escuchando"
            );

            console.log(
                "Micrófono:",
                event.error
            );

            if (
                event.error ===
                "not-allowed"
            ) {

                status.innerText =
                    "MICRÓFONO BLOQUEADO";

            }

        };


    recognition.onend =
        function() {

            escuchando = false;

            orbe.classList.remove(
                "escuchando"
            );

            if (
                sistemaActivo &&
                !hablando
            ) {

                esperarEscucha();

            }

        };


    return true;
}


function iniciarEscucha() {

    if (
        !sistemaActivo ||
        hablando
    )
        return;

    if (!recognition) {

        if (
            !prepararRecognition()
        )
            return;

    }

    try {

        recognition.start();

    }
    catch(e) {}

}


function esperarEscucha() {

    clearTimeout(
        reinicio
    );

    reinicio =
        setTimeout(
            iniciarEscucha,
            800
        );

}


/* ============================
   ACTIVAR
============================ */

function activarNOVA() {

    if (sistemaActivo)
        return;

    sistemaActivo = true;

    esperandoComando =
        false;

    status.innerText =
        "ESPERANDO NOVA";

    agregarMensaje(
        "nova",
        'Sistema activado. Di "NOVA".'
    );

    iniciarEscucha();

}


/* ============================
   DETENER
============================ */

function detenerNOVA() {

    sistemaActivo = false;

    esperandoComando = false;

    hablando = false;

    clearTimeout(
        reinicio
    );

    speechSynthesis.cancel();

    detenerReconocimiento();

    status.innerText =
        "SISTEMA DETENIDO";

}


/* ============================
   DETECTAR NOVA
============================ */

function detectarNOVA(texto) {

    return (
        texto.includes("nova") ||
        texto.includes("noba") ||
        texto.includes("no va")
    );

}


/* ============================
   LIMPIAR PREGUNTA
============================ */

function limpiarPregunta(texto) {

    return texto
        .toLowerCase()
        .replace(/[¿?¡!.,]/g, "")
        .replace(
            /\b(nova|oye|dime|me puedes decir|puedes decirme|quiero saber|sabes)\b/g,
            ""
        )
        .replace(/\s+/g, " ")
        .trim();

}


/* ============================
   CONOCIMIENTO
============================ */

function conocimientoDirecto(
    pregunta
) {

    const p =
        limpiarPregunta(
            pregunta
        );


    if (
        p.includes(
            "cuantos huesos tiene el cuerpo humano"
        ) ||
        p.includes(
            "número de huesos del cuerpo humano"
        ) ||
        p.includes(
            "numero de huesos del cuerpo humano"
        )
    ) {

        return "El cuerpo humano adulto tiene normalmente 206 huesos.";

    }


    if (
        p.includes(
            "cuantos planetas hay"
        ) ||
        p.includes(
            "cuántos planetas hay"
        )
    ) {

        return "Actualmente se reconocen 8 planetas en el sistema solar.";

    }


    if (
        p.includes(
            "planeta mas grande"
        ) ||
        p.includes(
            "planeta más grande"
        )
    ) {

        return "Júpiter es el planeta más grande del sistema solar.";

    }


    if (
        p === "que es el sol" ||
        p === "qué es el sol"
    ) {

        return "El Sol es una estrella situada en el centro del sistema solar.";

    }


    if (
        p === "que es la tierra" ||
        p === "qué es la tierra"
    ) {

        return "La Tierra es el tercer planeta del sistema solar y el planeta donde vivimos.";

    }


    if (
        p === "que es la luna" ||
        p === "qué es la luna"
    ) {

        return "La Luna es el satélite natural de la Tierra.";

    }


    if (
        p.includes(
            "capital de mexico"
        ) ||
        p.includes(
            "capital de méxico"
        )
    ) {

        return "La capital de México es Ciudad de México.";

    }


    if (
        p.includes(
            "cuantos dias tiene una semana"
        ) ||
        p.includes(
            "cuántos días tiene una semana"
        )
    ) {

        return "Una semana tiene 7 días.";

    }


    if (
        p.includes(
            "cuantas horas tiene un dia"
        ) ||
        p.includes(
            "cuántas horas tiene un día"
        )
    ) {

        return "Un día tiene 24 horas.";

    }


    if (
        p.includes(
            "cuantos minutos tiene una hora"
        ) ||
        p.includes(
            "cuántos minutos tiene una hora"
        )
    ) {

        return "Una hora tiene 60 minutos.";

    }


    if (
        p.includes(
            "cuantos segundos tiene un minuto"
        ) ||
        p.includes(
            "cuántos segundos tiene un minuto"
        )
    ) {

        return "Un minuto tiene 60 segundos.";

    }


    if (
        p.includes(
            "que es un sintetizador"
        ) ||
        p.includes(
            "qué es un sintetizador"
        )
    ) {

        return "Un sintetizador es un instrumento electrónico que genera y modifica sonidos mediante señales electrónicas. Se usa muchísimo en música electrónica, pop, hip-hop y otros géneros.";

    }


    return null;

}


/* ============================
   PROCESADOR
============================ */

async function procesar(texto) {

    const pregunta =
        limpiarPregunta(
            texto
        );


    const directa =
        conocimientoDirecto(
            pregunta
        );


    if (directa) {

        responder(
            directa
        );

        return;

    }


    if (
        pregunta === "hola"
    ) {

        responder(
            "Hola. ¿Qué necesitas?"
        );

        return;

    }


    if (
        pregunta.includes(
            "hora"
        )
    ) {

        const hora =
            new Date()
                .toLocaleTimeString(
                    "es-MX",
                    {
                        hour:
                            "numeric",
                        minute:
                            "2-digit"
                    }
                );

        responder(
            "Son las " +
            hora
        );

        return;

    }


    if (
        pregunta.includes(
            "fecha"
        ) ||
        pregunta.includes(
            "que dia es hoy"
        ) ||
        pregunta.includes(
            "qué día es hoy"
        )
    ) {

        const fecha =
            new Date()
                .toLocaleDateString(
                    "es-MX",
                    {
                        weekday:
                            "long",
                        day:
                            "numeric",
                        month:
                            "long",
                        year:
                            "numeric"
                    }
                );

        responder(
            "Hoy es " +
            fecha
        );

        return;

    }


    if (
        pregunta.startsWith(
            "calcula "
        ) ||
        pregunta.startsWith(
            "calcular "
        )
    ) {

        let operacion =
            pregunta
                .replace(
                    "calcula",
                    ""
                )
                .replace(
                    "calcular",
                    ""
                )
                .trim();

        operacion =
            operacion
                .replace(
                    /por/g,
                    "*"
                )
                .replace(
                    /x/g,
                    "*"
                )
                .replace(
                    /más/g,
                    "+"
                )
                .replace(
                    /mas/g,
                    "+"
                )
                .replace(
                    /menos/g,
                    "-"
                );

        try {

            if (
                !/^[0-9+\-*/().\s]+$/
                    .test(
                        operacion
                    )
            ) {
                throw new Error();
            }

            const resultado =
                Function(
                    "return " +
                    operacion
                )();

            responder(
                "El resultado es " +
                resultado
            );

        }
        catch {

            responder(
                "No pude calcular esa operación."
            );

        }

        return;

    }


    if (
        pregunta.includes(
            "abre youtube"
        ) ||
        pregunta.includes(
            "abrir youtube"
        )
    ) {

        responder(
            "Abriendo YouTube."
        );

        setTimeout(
            () => {
                window.open(
                    "https://youtube.com",
                    "_blank"
                );
            },
            800
        );

        return;

    }


    if (
        pregunta.includes(
            "abre spotify"
        ) ||
        pregunta.includes(
            "abrir spotify"
        )
    ) {

        responder(
            "Abriendo Spotify."
        );

        setTimeout(
            () => {
                window.open(
                    "https://open.spotify.com",
                    "_blank"
                );
            },
            800
        );

        return;

    }


    if (
        pregunta.includes(
            "abre google"
        ) ||
        pregunta.includes(
            "abrir google"
        )
    ) {

        responder(
            "Abriendo Google."
        );

        setTimeout(
            () => {
                window.open(
                    "https://google.com",
                    "_blank"
                );
            },
            800
        );

        return;

    }


    if (
        pregunta.startsWith(
            "busca "
        ) ||
        pregunta.startsWith(
            "buscar "
        )
    ) {

        const busqueda =
            pregunta
                .replace(
                    "busca",
                    ""
                )
                .replace(
                    "buscar",
                    ""
                )
                .trim();

        if (!busqueda) {

            responder(
                "¿Qué quieres que busque?"
            );

            return;

        }

        responder(
            "Voy a buscar " +
            busqueda +
            " en Google."
        );

        setTimeout(
            () => {

                window.open(

                    "https://www.google.com/search?q=" +
                    encodeURIComponent(
                        busqueda
                    ),

                    "_blank"

                );

            },
            800
        );

        return;

    }


    if (
        pregunta.includes(
            "crea una imagen"
        ) ||
        pregunta.includes(
            "genera una imagen"
        ) ||
        pregunta.includes(
            "haz una imagen"
        )
    ) {

        responder(
            "Todavía no tengo conectado un generador de imágenes."
        );

        return;

    }


    await buscarWikipedia(
        pregunta
    );

}


/* ============================
   WIKIPEDIA
============================ */

async function buscarWikipedia(
    pregunta
) {

    status.innerText =
        "BUSCANDO INFORMACIÓN";

    const carga =
        agregarCarga();

    try {

        const url =
            "https://es.wikipedia.org/w/api.php" +
            "?action=query" +
            "&generator=search" +
            "&gsrsearch=" +
            encodeURIComponent(
                pregunta
            ) +
            "&gsrlimit=5" +
            "&prop=extracts" +
            "&exintro=1" +
            "&explaintext=1" +
            "&format=json" +
            "&origin=*";

        const response =
            await fetch(
                url
            );

        if (!response.ok)
            throw new Error();

        const data =
            await response.json();

        eliminarCarga(
            carga
        );

        if (
            !data.query ||
            !data.query.pages
        ) {

            responder(
                "No encontré una respuesta confiable para esa pregunta."
            );

            return;

        }

        const paginas =
            Object.values(
                data.query.pages
            );

        const palabras =
            pregunta
                .toLowerCase()
                .split(/\s+/)
                .filter(
                    palabra =>
                        palabra.length > 3
                );

        let mejor = null;

        let mejorPuntaje = 0;

        for (
            const pagina
            of paginas
        ) {

            const titulo =
                (
                    pagina.title ||
                    ""
                ).toLowerCase();

            const extracto =
                (
                    pagina.extract ||
                    ""
                ).toLowerCase();

            let puntaje = 0;

            for (
                const palabra
                of palabras
            ) {

                if (
                    titulo.includes(
                        palabra
                    )
                ) {
                    puntaje += 4;
                }

                if (
                    extracto.includes(
                        palabra
                    )
                ) {
                    puntaje += 1;
                }

            }

            if (
                puntaje >
                mejorPuntaje
            ) {

                mejorPuntaje =
                    puntaje;

                mejor =
                    pagina;

            }

        }

        if (
            !mejor ||
            mejorPuntaje < 2 ||
            !mejor.extract
        ) {

            responder(
                "No encontré información suficientemente relacionada con tu pregunta."
            );

            return;

        }

        let texto =
            mejor.extract;

        if (
            texto.length > 900
        ) {

            texto =
                texto.substring(
                    0,
                    900
                ) +
                "...";

        }

        agregarMensaje(
            "nova",
            texto
        );

        hablar(
            texto
        );

    }
    catch(error) {

        eliminarCarga(
            carga
        );

        responder(
            "No pude consultar la información en este momento."
        );

    }

}


/* ============================
   CARGANDO
============================ */

function agregarCarga() {

    const elemento =
        document.createElement(
            "div"
        );

    elemento.className =
        "mensaje nova";

    elemento.innerHTML =
        '<div class="etiqueta">NOVA</div>' +
        '<div class="burbuja">Analizando...</div>';

    mensajes.appendChild(
        elemento
    );

    mensajes.scrollTop =
        mensajes.scrollHeight;

    return elemento;

}


function eliminarCarga(
    elemento
) {

    if (elemento)
        elemento.remove();

}


/* ============================
   TEXTO
============================ */

function enviarTexto() {

    const texto =
        entrada.value.trim();

    if (!texto)
        return;

    entrada.value =
        "";

    agregarMensaje(
        "usuario",
        texto
    );

    procesar(
        texto.toLowerCase()
    );

}


/* ============================
   ENTER
============================ */

entrada.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            enviarTexto();

        }

    }
);

    );
